# Publication du site sur GitHub Pages.
# À chaque envoi (push) sur la branche main : tests du site, construction, mise en ligne.
# Les données (site/public/data/) sont déjà dans le dépôt : le pipeline Python n'est pas relancé ici.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch: # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle publication remplace celle en attente.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - id: publication
        uses: actions/deploy-pages@v4
